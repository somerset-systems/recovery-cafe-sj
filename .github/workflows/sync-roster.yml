name: Sync roster

# Pulls the live Google Sheet roster + attendance into Supabase.
# Runs automatically once a day, and can be triggered by hand from the Actions tab.

on:
  schedule:
    # GitHub cron is always UTC and does NOT follow daylight saving.
    # 12:00 UTC = 5:00 AM PDT (summer) / 4:00 AM PST (winter).
    - cron: '0 12 * * *'
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # issues: write lets the failure step open a notification issue.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22+ required: @supabase/supabase-js needs native WebSocket (absent in Node 20).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run roster sync
        run: node scripts/syncSheet.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The skip report lists members who couldn't be matched to a phone number.
      # It contains real names, so it is uploaded as a private build artifact, not committed.
      - name: Upload skip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skip-report
          path: skip-report*.csv
          if-no-files-found: ignore
          retention-days: 7

      # If the sync fails, open (or reuse) a GitHub issue so the failure is visible
      # and emails the repo owner. Reuses one open issue instead of spamming a new
      # one every day the sync stays broken.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- roster-sync-failure -->';
            const body = `${marker}\nThe daily **roster sync** workflow failed.\n\n` +
              `Failed run: ${runUrl}\n\n` +
              `The app keeps serving the last good data in Supabase, so members are not broken — ` +
              `but new roster, chore, and attendance updates will not appear until this is fixed and re-run from the Actions tab.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Sync failed again on ${new Date().toISOString().slice(0, 10)}.\n\nFailed run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Roster sync is failing',
                body,
                labels: ['sync-failure'],
              });
            }
