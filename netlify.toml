[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/api/circle-location"
  to = "/.netlify/functions/circle-location"
  status = 200

[[redirects]]
  from = "/api/send-code"
  to = "/.netlify/functions/send-code"
  status = 200

[[redirects]]
  from = "/api/verify-code"
  to = "/.netlify/functions/verify-code"
  status = 200

# Serve static HTML for legal pages so Twilio's crawler (no JS) can read them.
# These must come before the SPA catch-all below.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
